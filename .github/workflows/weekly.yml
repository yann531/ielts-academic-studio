name: Weekly question bank release
on:
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-refs/heads/main
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/publish-weekly.mjs
      - run: pnpm test && pnpm check:content && pnpm build
      - name: Save released content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/papers.json content-reserve/released.json
          git diff --cached --quiet || git commit -m 'content: release weekly original practice'
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
