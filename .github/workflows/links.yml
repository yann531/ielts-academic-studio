name: Monthly resource link check
on:
  schedule:
    - cron: '23 3 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-links.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-link-review
          path: reports/link-check.json
          retention-days: 14
